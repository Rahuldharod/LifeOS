<!doctype html>
<!-- PROTOTYPE ONLY: six further LifeOS Today directions, G–L, switchable with ?variant=. Based on E, slightly warmer neutrals, and Color Hunt #201E43/#134B70/#508C9B/#EEEEEE. Example content only; no persistence. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LifeOS · softer editorial directions</title>
  <style>
    :root{--midnight:#201e43;--blue:#134b70;--teal:#508c9b;--grey:#eeeeee;--paper:#f8f6f4;--paper-deep:#f2efed;--white:#fff;--muted:#606578;--line:#dcdde0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;color:var(--midnight);background:var(--paper)}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}h1,h2,h3,p{margin:0}h1{font-size:clamp(38px,4.4vw,66px);line-height:1.035;letter-spacing:-.06em;font-weight:760}h2{font-size:20px;letter-spacing:-.035em}h3{font-size:15px}p{line-height:1.5}.label{font-size:11px;font-weight:820;letter-spacing:.12em;text-transform:uppercase}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:15px}.button{min-height:42px;padding:10px 16px;border:0;border-radius:8px;background:var(--blue);color:var(--white);font-weight:760}.text-button{padding:5px 0;border:0;background:transparent;color:var(--blue);font-size:12px;font-weight:780;text-decoration:underline;text-underline-offset:3px}.chip{display:inline-flex;align-items:center;border-radius:99px;padding:6px 10px;background:#508c9b22;color:var(--blue);font-size:11px;font-weight:780}.tasks{list-style:none;margin:0;padding:0}.tasks li{display:flex;align-items:start;gap:15px;padding:19px 0;border-top:1px solid var(--line)}.tasks li:first-child{border-top:0}.tasks strong,.tasks small{display:block}.tasks strong{font-size:16px}.tasks small{margin-top:5px;color:var(--muted);font-size:12px}.check{flex:none;width:22px;height:22px;margin-top:1px;border:2px solid var(--blue);border-radius:6px;background:transparent}.meetings{list-style:none;margin:0;padding:0}.meetings li{display:grid;grid-template-columns:54px 1fr;gap:12px;padding:15px 0;border-top:1px solid var(--line)}.meetings li:first-child{border-top:0}.meetings time{font-size:13px;font-weight:850;color:var(--blue)}.meetings strong,.meetings small{display:block}.meetings strong{font-size:13px}.meetings small{margin-top:4px;color:var(--muted);font-size:12px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.section-head h2{margin:0}.swatches{display:flex;flex-wrap:wrap;gap:11px;margin-top:29px}.swatches span{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:10px}.swatches i{display:inline-block;width:17px;height:17px;border:1px solid #201e432e;border-radius:5px}.prototype{position:fixed;top:12px;right:14px;z-index:9;padding:7px 10px;border-radius:99px;background:var(--midnight);color:var(--white);font-size:10px;font-weight:800;letter-spacing:.07em;box-shadow:0 5px 18px #201e4333}.stage{min-height:100vh;padding-bottom:120px}.main{min-width:0;padding:45px clamp(25px,5.2vw,82px) 65px}.brand{font-size:27px;font-weight:820;letter-spacing:-.07em}.side-shell{display:grid;grid-template-columns:76px minmax(0,1fr);min-height:100vh}.icon-rail{display:flex;flex-direction:column;align-items:center;gap:14px;padding:23px 9px;background:var(--midnight);color:var(--white)}.icon-rail .brand{margin-bottom:18px;font-size:20px}.icon-rail button{width:43px;height:43px;border:0;border-radius:10px;background:transparent;color:inherit;font-size:18px;font-weight:800}.icon-rail button.active{background:var(--blue)}.icon-rail .bottom{margin-top:auto}.full-nav{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:19px clamp(24px,5vw,78px);background:var(--midnight);color:var(--white)}.full-nav nav{display:flex;flex-wrap:wrap;gap:4px}.full-nav nav button{min-height:36px;padding:8px 11px;border:0;border-radius:7px;background:transparent;color:inherit;font-size:12px}.full-nav nav button.active{background:var(--blue);font-weight:820}.page-heading{display:flex;align-items:start;justify-content:space-between;gap:25px;margin-bottom:33px}.page-heading .label{display:block;margin-bottom:13px;color:var(--blue)}.page-heading p{max-width:60ch;margin-top:13px;color:var(--muted)}.page-heading .button{white-space:nowrap}.surface{padding:24px;border:1px solid var(--line);border-radius:13px;background:var(--white)}
    /* G — E refined: same icon rail and editorial split; warm-grey page, restrained teal rule. */
    body[data-variant="G"]{background:var(--paper)}.g-heading{padding-bottom:29px;border-bottom:3px solid var(--teal)}.g-heading h1{max-width:18ch}.g-columns{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.7fr);gap:68px}.g-tasks .tasks li{padding:24px 0}.g-tasks .tasks strong{font-size:18px}.g-aside{padding-left:27px;border-left:1px solid var(--line)}.g-aside .meetings li{padding:22px 0}.g-note{margin-top:24px;padding:20px;background:var(--paper-deep);border-left:4px solid var(--teal)}.g-note h2{margin:8px 0}
    /* H — Numbered essay: cream-free typography and numbered priorities, with a slim utility rail. */
    body[data-variant="H"]{background:#f6f3f2}.h-shell{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:100vh}.h-nav{display:flex;flex-direction:column;padding:31px 17px;background:var(--paper-deep)}.h-nav .brand{margin-bottom:38px}.h-nav button{width:100%;min-height:39px;padding:9px 12px;border:0;border-radius:7px;background:transparent;color:var(--midnight);text-align:left}.h-nav button.active{background:var(--midnight);color:var(--white);font-weight:780}.h-nav .bottom{margin-top:auto}.h-heading{max-width:850px}.h-heading h1{max-width:15ch}.h-grid{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:48px;margin-top:35px}.h-numbered{counter-reset:priority;list-style:none;margin:0;padding:0}.h-numbered li{counter-increment:priority;display:grid;grid-template-columns:56px minmax(0,1fr);gap:16px;padding:24px 0;border-top:1px solid #201e4333}.h-numbered li::before{content:"0" counter(priority);color:var(--teal);font-size:27px;font-weight:780;letter-spacing:-.05em}.h-numbered strong{font-size:19px}.h-numbered small{display:block;margin-top:7px;color:var(--muted)}.h-utility{padding-top:24px;border-top:3px solid var(--blue)}.h-utility .meetings{margin-top:18px}.h-utility .meetings li{display:block}.h-utility time{display:block;margin-bottom:5px}.h-inbox{margin-top:24px;padding-top:19px;border-top:1px solid var(--line)}
    /* I — Paper journal: top navigation, broad journal header, schedule as horizontal strip. */
    body[data-variant="I"]{background:#f9f7f5}.i-intro{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:35px;align-items:end;padding-bottom:29px;border-bottom:1px solid var(--line)}.i-intro h1{max-width:16ch}.i-intro .aside-copy{padding:20px;border-radius:11px;background:var(--grey)}.i-agenda{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;margin:26px 0 32px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line)}.i-agenda div{min-height:112px;padding:20px;background:var(--white)}.i-agenda strong,.i-agenda small{display:block;margin-top:8px}.i-work{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(260px,.65fr);gap:35px}.i-work .surface{background:var(--paper)}.i-work .tasks li:first-of-type{border-top:0}.i-note{padding:25px;background:#dfe8e8;border-radius:12px}.i-note h2{margin:12px 0 9px}
    /* J — Open canvas: minimal left rail, work in a centered reading column, timeline on far right. */
    body[data-variant="J"]{background:var(--white)}.j-shell{display:grid;grid-template-columns:76px minmax(0,1fr) 260px;min-height:100vh}.j-content{padding:51px clamp(26px,5vw,85px)}.j-content h1{max-width:12ch}.j-content .intro{max-width:48ch;margin:15px 0 47px}.j-content .tasks li{padding:25px 0}.j-content .tasks strong{font-size:19px}.j-right{padding:49px 24px;background:#f4f2f0;border-left:1px solid var(--line)}.j-right .meetings{margin-top:19px}.j-right .meetings li{display:block;padding:20px 0}.j-right time{display:block;margin-bottom:6px}.j-right .inbox{margin-top:27px;padding:22px;border-radius:10px;background:var(--white)}.j-right .inbox h2{margin:9px 0}.j-content .button{margin-top:18px}
    /* K — Quiet banner: dark blue header, pale work surface and compact agenda band. */
    body[data-variant="K"]{background:#f4f1ef}.k-hero{padding:40px clamp(25px,5vw,78px) 46px;background:var(--blue);color:var(--white)}.k-hero .label{color:#d5edf0}.k-hero h1{max-width:17ch;margin:13px 0}.k-hero p{max-width:54ch;color:#e2eef0}.k-hero .button{background:var(--white);color:var(--blue)}.k-main{padding-top:28px}.k-grid{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:22px}.k-focus{padding:30px;background:var(--white);border-radius:12px}.k-focus .tasks li{padding:24px 0}.k-focus .tasks strong{font-size:18px}.k-agenda{padding:24px;background:#e8ecec;border-radius:12px}.k-agenda .meetings{margin-top:10px}.k-agenda .inbox{margin-top:18px;padding-top:20px;border-top:1px solid #134b7040}
    /* L — Warm-grey workspace: three column lanes but light and text-led, not a dense board. */
    body[data-variant="L"]{background:#f5f2f0}.l-heading{padding-bottom:24px;border-bottom:2px solid var(--midnight)}.l-heading h1{max-width:18ch}.l-summary{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0 28px}.l-summary span{padding:9px 13px;border-radius:99px;background:var(--white);color:var(--blue);font-size:12px;font-weight:780}.l-lanes{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(240px,.8fr) minmax(240px,.8fr);gap:24px}.l-lane{padding-top:15px;border-top:4px solid var(--blue)}.l-lane:nth-child(2){border-color:var(--teal)}.l-lane:nth-child(3){border-color:var(--midnight)}.l-lane h2{margin-bottom:21px}.l-lane .tasks li{padding:18px 0}.l-lane .meetings li{padding:18px 0}.l-review{padding:22px;background:var(--white);border-radius:11px}.l-review h3{margin:9px 0}.l-review + .l-review{margin-top:12px}
    .switcher{position:fixed;z-index:12;bottom:15px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;max-width:calc(100vw - 22px);padding:7px 10px;border-radius:99px;background:var(--midnight);color:var(--white);box-shadow:0 9px 30px #201e4366;font-size:12px;white-space:nowrap}.switcher button{min-width:34px;height:34px;border:0;border-radius:18px;background:var(--blue);color:var(--white);font-weight:800}.switcher button.current{background:var(--white);color:var(--midnight)}.switcher .arrow{min-width:36px;background:var(--teal);color:var(--midnight);font-size:21px}.switcher .current-name{max-width:200px;padding:0 7px;overflow:hidden;text-overflow:ellipsis}.switcher .divider{width:1px;height:23px;background:#ffffff55}.switcher button:focus-visible{outline-color:var(--white)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:1050px){.g-columns,.h-grid,.i-work,.k-grid{grid-template-columns:1fr}.g-columns{gap:26px}.g-aside{padding:0;border:0}.i-intro{grid-template-columns:1fr}.j-shell{grid-template-columns:76px minmax(0,1fr)}.j-right{grid-column:2}.l-lanes{grid-template-columns:1fr 1fr}.l-lane:first-child{grid-column:1/-1}}
    @media(max-width:730px){.side-shell,.h-shell,.j-shell{display:block}.icon-rail{height:60px;flex-direction:row;gap:7px;padding:8px 14px}.icon-rail .brand{margin:0 auto 0 0}.icon-rail .bottom{display:none}.icon-rail button{width:38px;height:38px}.h-nav{display:flex;flex-direction:row;align-items:center;gap:4px;overflow:auto;padding:12px}.h-nav .brand{margin:0 8px 0 0;font-size:21px}.h-nav button{white-space:nowrap;width:auto}.h-nav .bottom{display:none}.full-nav{display:block}.full-nav nav{margin-top:10px}.main,.j-content{padding:29px 20px 105px}.page-heading{display:block}.page-heading .button{margin-top:18px}.i-agenda{grid-template-columns:1fr}.j-right{padding:25px 20px}.l-lanes{grid-template-columns:1fr}.l-lane:first-child{grid-column:auto}.switcher .current-name{display:none}.switcher{gap:4px}.prototype{display:none}}
  </style>
</head>
<body data-variant="G">
  <div class="prototype">PROTOTYPE · EXAMPLE CONTENT · NO SAVING</div>
  <div class="stage" id="screen"></div>
  <div class="switcher" aria-label="Design variation switcher"><button class="arrow" id="previous" aria-label="Previous variation">←</button><span class="current-name" id="current-name"></span><span class="divider"></span><button data-choice="G">G</button><button data-choice="H">H</button><button data-choice="I">I</button><button data-choice="J">J</button><button data-choice="K">K</button><button data-choice="L">L</button><button class="arrow" id="next" aria-label="Next variation">→</button></div>
  <div id="state" class="sr-only" role="status" aria-live="polite"></div>
  <script>
    const variants=["G","H","I","J","K","L"],names={G:"E, softened",H:"Numbered essay",I:"Paper journal",J:"Open canvas",K:"Quiet banner",L:"Warm-grey workspace"};
    const taskData=[["Prepare meeting notes","Project check-in · Today"],["Review household budget","Household · Tomorrow"],["Plan weekend hike","Personal · This week"]];
    const meetingData=[["10:30","Project check-in","Notes ready · 30 min"],["14:00","Call with Alex","1 open point · 45 min"]];
    const tasks=()=>`<ul class="tasks">${taskData.map(([title,detail])=>`<li><button class="check" aria-label="Preview complete ${title}"></button><span><strong>${title}</strong><small>${detail}</small></span></li>`).join("")}</ul>`;
    const meetings=()=>`<ul class="meetings">${meetingData.map(([time,title,detail])=>`<li><time>${time}</time><span><strong>${title}</strong><small>${detail}</small></span></li>`).join("")}</ul>`;
    const swatches=()=>`<div class="swatches" aria-label="Palette colours"><span><i style="background:#201e43"></i>#201E43</span><span><i style="background:#134b70"></i>#134B70</span><span><i style="background:#508c9b"></i>#508C9B</span><span><i style="background:#eeeeee"></i>#EEEEEE</span><span><i style="background:#f8f6f4"></i>warmer off-white</span></div>`;
    const iconRail=()=>`<aside class="icon-rail" aria-label="Main navigation"><div class="brand">L.</div><button class="active" aria-label="Today">◉</button><button aria-label="Calendar">▦</button><button aria-label="Tasks">☑</button><button aria-label="Notes">▤</button><button aria-label="Inbox">◇</button><button class="bottom" aria-label="Settings">⚙</button></aside>`;
    const topNav=()=>`<header class="full-nav"><div class="brand">LifeOS</div><nav aria-label="Main navigation"><button class="active">Today</button><button>Calendar</button><button>Tasks</button><button>Notes</button><button>Inbox</button><button>Settings</button></nav></header>`;
    const G=()=>`<div class="side-shell">${iconRail()}<main class="main"><header class="page-heading g-heading"><div><span class="label">Today · direction G</span><h1>Begin with the next useful step.</h1><p>Everything important, with a little more warmth and less visual noise.</p></div><button class="button">+ Capture</button></header><div class="g-columns"><section class="g-tasks"><div class="section-head"><h2>What matters</h2><span class="chip">3 priorities</span></div>${tasks()}<button class="text-button">View all tasks →</button></section><aside class="g-aside"><div class="section-head"><h2>Coming up</h2><button class="text-button">Calendar →</button></div>${meetings()}<div class="g-note"><span class="label">Inbox</span><h2>3 things need a decision.</h2><p class="small muted">They can wait until after your first meeting.</p></div></aside></div>${swatches()}</main></div>`;
    const H=()=>`<div class="h-shell"><aside class="h-nav"><div class="brand">LifeOS</div><nav aria-label="Main navigation"><button class="active">Today</button><button>Calendar</button><button>Tasks</button><button>Notes</button><button>Inbox</button></nav><button class="bottom">Settings</button></aside><main class="main"><header class="h-heading"><div class="page-heading"><div><span class="label">Today · direction H</span><h1>Three things worth your attention.</h1><p>Text-first and deliberate, like a personal brief rather than a dashboard.</p></div><button class="button">+ Capture</button></div></header><div class="h-grid"><section><div class="section-head"><h2>Priorities</h2><span class="chip">01—03</span></div><ol class="h-numbered">${taskData.map(([title,detail])=>`<li><span><strong>${title}</strong><small>${detail}</small></span></li>`).join("")}</ol></section><aside class="h-utility"><span class="label">Your schedule</span>${meetings()}<div class="h-inbox"><span class="label">Inbox</span><h2 style="margin:10px 0">3 to review</h2><p class="small muted">Decide what to keep later.</p></div></aside></div>${swatches()}</main></div>`;
    const I=()=>`${topNav()}<main class="main"><div class="i-intro"><div><span class="label">Today · direction I</span><h1>A clear day starts here.</h1><p class="muted" style="margin-top:15px">A gentle journal layout with your day stretched out in front of you.</p></div><div class="aside-copy"><span class="label">A note for today</span><p class="small" style="margin-top:9px">Start with the check-in notes. The rest can follow.</p></div></div><div class="i-agenda"><div><span class="label">First</span><strong>Prepare meeting notes</strong><small class="muted">Your priority</small></div><div><span class="label">10:30</span><strong>Project check-in</strong><small class="muted">30 min</small></div><div><span class="label">14:00</span><strong>Call with Alex</strong><small class="muted">45 min</small></div></div><div class="i-work"><section class="surface"><div class="section-head"><h2>To move forward</h2><button class="text-button">All tasks →</button></div>${tasks()}</section><aside class="i-note"><span class="label">Inbox</span><h2>3 items to review</h2><p class="small muted">Proposed actions wait until you choose what to keep.</p><button class="button" style="margin-top:21px">Open Inbox</button></aside></div>${swatches()}</main>`;
    const J=()=>`<div class="j-shell">${iconRail()}<main class="j-content"><span class="label">Today · direction J</span><h1>Keep the day simple.</h1><p class="intro muted">A reading-width focus list leaves the schedule visible without crowding your work.</p><div class="section-head"><h2>Focus now</h2><span class="chip">3 priorities</span></div>${tasks()}<button class="button">+ Capture an idea</button>${swatches()}</main><aside class="j-right"><span class="label">Coming up</span>${meetings()}<div class="inbox"><span class="label">Inbox</span><h2>3 items</h2><p class="small muted">Review when ready.</p></div></aside></div>`;
    const K=()=>`${topNav()}<header class="k-hero"><div class="row"><div><span class="label">Today · direction K</span><h1>Make room for what matters.</h1><p>Deep blue gives the page structure; quiet neutral surfaces keep the work calm.</p></div><button class="button">+ Capture</button></div></header><main class="main k-main"><div class="k-grid"><section class="k-focus"><div class="section-head"><h2>Your priorities</h2><span class="chip">1 of 3 complete</span></div>${tasks()}<button class="text-button">All tasks →</button></section><aside class="k-agenda"><span class="label">Your day</span>${meetings()}<div class="inbox"><span class="label">Inbox</span><h2 style="margin:9px 0">3 to review</h2><p class="small muted">Nothing is added until you decide.</p></div></aside></div>${swatches()}</main>`;
    const L=()=>`${topNav()}<main class="main"><header class="page-heading l-heading"><div><span class="label">Today · direction L</span><h1>See the day in one glance.</h1><p>Warm grey grounds a light workspace, with only the useful sections in view.</p></div><button class="button">+ Capture</button></header><div class="l-summary"><span>3 priorities</span><span>2 meetings</span><span>3 Inbox items</span></div><div class="l-lanes"><section class="l-lane"><h2>Do next</h2>${tasks()}<button class="text-button">All tasks →</button></section><section class="l-lane"><h2>On the calendar</h2>${meetings()}</section><section class="l-lane"><h2>Needs a decision</h2><div class="l-review"><span class="label">Inbox</span><h3>Meeting follow-up draft</h3><p class="small muted">Review before adding tasks.</p></div><div class="l-review"><span class="label">Inbox</span><h3>Two captured ideas</h3><p class="small muted">Keep, edit, or dismiss.</p></div></section></div>${swatches()}</main>`;
    let variant=new URL(location.href).searchParams.get("variant")||"G";if(!variants.includes(variant))variant="G";
    function render(){document.body.dataset.variant=variant;document.getElementById("screen").innerHTML=({G,H,I,J,K,L})[variant]();document.getElementById("current-name").textContent=`${variant} · ${names[variant]}`;document.getElementById("state").textContent=`Showing ${variant}: ${names[variant]}`;document.querySelectorAll("[data-choice]").forEach(button=>{const active=button.dataset.choice===variant;button.classList.toggle("current",active);button.setAttribute("aria-current",active?"true":"false")})}
    function choose(next){variant=next;const url=new URL(location.href);url.searchParams.set("variant",variant);history.replaceState(null,"",url);render()}
    function cycle(step){choose(variants[(variants.indexOf(variant)+step+variants.length)%variants.length])}
    document.getElementById("previous").addEventListener("click",()=>cycle(-1));document.getElementById("next").addEventListener("click",()=>cycle(1));document.querySelectorAll("[data-choice]").forEach(button=>button.addEventListener("click",()=>choose(button.dataset.choice)));document.addEventListener("keydown",event=>{if((event.key==="ArrowLeft"||event.key==="ArrowRight")&&!event.target.closest("input,textarea,select,[contenteditable]")){event.preventDefault();cycle(event.key==="ArrowRight"?1:-1)}});render();
  </script>
</body>
</html>
