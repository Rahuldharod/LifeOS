<!doctype html>
<!-- PROTOTYPE ONLY. Synthetic examples; no data connection or persistence. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LifeOS design comparison</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    body[data-variant="A"]{--page:#eaf1f0;--side:#18252b;--surface:#fff;--ink:#20333b;--muted:#536b70;--accent:#006d71;--soft:#d8ece9;--line:#d6e3e3}
    body[data-variant="B"]{--page:#f6f0e8;--side:#413a32;--surface:#fffcf7;--ink:#342d2a;--muted:#716963;--accent:#a3482f;--soft:#eeded1;--line:#e3d9ce}
    body[data-variant="C"]{--page:#edf2f9;--side:#172b48;--surface:#fff;--ink:#182943;--muted:#61718a;--accent:#2456a6;--soft:#e3ecfa;--line:#d5dfed}
    .shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh;background:var(--page);color:var(--ink)}
    .app-nav{position:sticky;top:0;height:100vh;padding:38px 20px;background:var(--side);color:#fff;display:flex;flex-direction:column}.brand{font:30px Georgia,serif;margin:0 0 38px}.app-nav nav{display:grid;gap:2px}.app-nav button{border:0;border-radius:7px;padding:10px 12px;background:transparent;color:#e4ebeb;text-align:left}.app-nav button:last-child{margin-top:24px;background:#ffffff18}.app-nav button:hover{background:#ffffff22}.app-nav footer{margin-top:auto;border-top:1px solid #ffffff30;padding-top:13px}
    .workspace{padding:38px clamp(24px,4vw,70px) 100px}.prototype-note{position:fixed;right:14px;top:12px;z-index:5;padding:7px 10px;border-radius:999px;background:#17212d;color:#fff;font-size:11px;font-weight:700;letter-spacing:.05em}
    .eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.13em}.hero h1{margin:6px 0 9px;font-size:clamp(34px,3.4vw,52px);line-height:1.1;letter-spacing:-.04em}.hero p{max-width:58ch;margin:0;color:var(--muted)}body[data-variant="B"] .hero h1,body[data-variant="B"] h2{font-family:Georgia,serif;font-weight:500;letter-spacing:-.02em}
    .layout{display:grid;gap:24px;margin-top:32px}body[data-variant="A"] .layout{grid-template-columns:205px minmax(0,1fr)}body[data-variant="B"] .layout{grid-template-columns:1fr}body[data-variant="C"] .layout{grid-template-columns:190px minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
    .tabs{display:flex;gap:3px}body[data-variant="A"] .tabs,body[data-variant="C"] .tabs{flex-direction:column;padding:13px;background:var(--surface);border:1px solid var(--line);border-radius:12px;align-self:start}body[data-variant="C"] .tabs{border:0;border-right:1px solid var(--line);border-radius:0;background:#f8fafd;min-height:500px}body[data-variant="B"] .tabs{flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
    .tabs button{border:0;border-radius:7px;padding:10px 12px;background:transparent;color:var(--muted);text-align:left;font-weight:650;white-space:nowrap}.tabs button[aria-current="page"]{background:var(--soft);color:var(--accent)}body[data-variant="B"] .tabs button{border-radius:99px}.group{padding:14px 10px 3px;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.12em}body[data-variant="B"] .group{display:none}
    .content{min-width:0}body[data-variant="C"] .content{padding:26px}.card{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:26px}.card h2{margin:7px 0 10px;font-size:29px;line-height:1.2}.card p{margin:0 0 22px;max-width:64ch;color:var(--muted)}.button{display:inline-block;min-height:42px;padding:9px 16px;border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:#fff;font-weight:700}.secondary{background:var(--surface);color:var(--accent)}.overview{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}.overview .feature{grid-row:span 2;min-height:330px;padding:30px;background:var(--accent);color:white}.feature h2{max-width:13ch;margin:28px 0 13px;color:white;font-size:35px}.feature p,.feature .eyebrow{color:#fff}.overview .stat{min-height:155px}.stat strong{display:block;margin:14px 0 2px;font-size:29px}.stat p{margin-top:8px;font-size:13px}
    .form{max-width:760px}.form label{display:block;max-width:440px;margin:18px 0;font-size:13px;font-weight:700}.form input{display:block;width:100%;min-height:44px;margin-top:6px;padding:9px 12px;border:1px solid #aebec0;border-radius:7px;color:var(--ink);background:#fff}.row{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:66px;padding:12px 4px;border-top:1px solid var(--line)}.row strong,.row small{display:block}.row small{color:var(--muted);font-size:12px}.row b{color:var(--accent)}
    body[data-variant="B"] .hero{min-height:178px}body[data-variant="B"] .content{max-width:1080px}body[data-variant="C"] .hero:after{content:"Calendar connected     ·     Backup verified     ·     Device writable";display:block;margin-top:25px;padding:13px 16px;border-radius:8px;background:#dfe9f7;color:#2456a6;font-size:13px;font-weight:700}
    .switcher{position:fixed;z-index:6;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:9px;max-width:calc(100vw - 30px);padding:6px;border-radius:999px;background:#162234;color:white;box-shadow:0 10px 35px #17212d55;font-size:12px;white-space:nowrap}.switcher button{display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:50%;background:#34445b;color:white;font-size:19px}.switcher span{padding:0 7px}.switcher strong{color:#8ce1dd}.state{position:fixed;right:16px;bottom:20px;padding:8px 11px;border-radius:7px;background:#162234;color:white;font-size:11px}
    @media(max-width:1050px){.state{display:none}.overview{grid-template-columns:1fr}.overview .feature{grid-row:auto;min-height:260px}}@media(max-width:780px){.shell{grid-template-columns:1fr}.app-nav{position:static;height:auto;padding:14px 20px}.brand{margin:0 0 10px}.app-nav nav{display:flex;flex-wrap:wrap}.app-nav footer{display:none}.workspace{padding:28px 20px 95px}body[data-variant="A"] .layout,body[data-variant="C"] .layout{grid-template-columns:1fr}.tabs{flex-wrap:wrap!important;min-height:0!important}.group{display:none}.switcher span{overflow:hidden;text-overflow:ellipsis;max-width:210px}}
  </style>
</head>
<body data-variant="A">
  <div class="prototype-note">PROTOTYPE · Synthetic examples · No saving</div>
  <div class="shell"><aside class="app-nav"><div class="brand">LifeOS</div><nav aria-label="App navigation"><button>Today</button><button>Calendar</button><button>Tasks</button><button>Notes</button><button>Inbox</button><button>Decisions</button><button>Open Points</button><button>Knowledge</button><button>System</button></nav><footer><button>Settings</button></footer></aside>
  <main class="workspace"><header class="hero"><span class="eyebrow" id="variant-title">SETTINGS · PROTOTYPE A</span><h1 id="headline">A quieter workspace</h1><p id="description">Focused choices, clear navigation, and a cool slate-and-teal palette.</p></header><div class="layout"><nav class="tabs" id="tabs" aria-label="Settings sections"></nav><section class="content" id="content" aria-live="polite"></section></div></main></div>
  <div class="state" id="state"></div><div class="switcher" aria-label="Design variations"><button id="previous" aria-label="Previous design">←</button><span id="variant-name"></span><button id="next" aria-label="Next design">→</button></div>
  <script>
    const variants=["A","B","C"];
    const names={A:"Slate & teal · quiet workspace",B:"Paper & terracotta · personal desk",C:"Blue & graphite · clear console"};
    const headlines={A:"A quieter workspace",B:"Your personal desk",C:"Workspace controls"};
    const descriptions={A:"Focused choices, clear navigation, and a cool slate-and-teal palette.",B:"Warm paper, terracotta accents and room to breathe.",C:"Direct access to every setting and reference list."};
    const sections=["Overview","Identity","Today","Calendar","Connections","Backups","Projects","Clients","Products","People"];
    const examples={Projects:[["Home renovation","Active · 8 tasks"],["Learning plan","Active · 3 tasks"]],Clients:[["Example client","Active · 4 meetings"],["Community partner","Active · 2 projects"]],Products:[["Loyalty platform","Active · 3 projects"],["Personalisation","Active · 6 notes"]],People:[["Alex Morgan","Internal · 5 meetings"],["Sam Taylor","External · 2 open points"],["Jordan Lee","Unreviewed · 1 meeting"]]};
    let variant=new URL(location.href).searchParams.get("variant")||"A";if(!variants.includes(variant))variant="A";let section="Overview";
    const text=(value)=>String(value).replace(/[&<>"']/g,(char)=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[char]);
    function panel(){
      if(section==="Overview")return '<div class="overview"><div class="card feature"><span class="eyebrow">START HERE</span><h2>Make LifeOS yours.</h2><p>Set how your day is planned, connect your calendar, and keep your reference lists current.</p><button class="button secondary">Review daily focus</button></div><div class="card stat"><span class="eyebrow">YOUR WORKSPACE</span><strong>4</strong>reference lists<p>Projects, clients, products and people live here when you need to maintain them.</p></div><div class="card stat"><span class="eyebrow">CALENDAR</span><strong>2</strong>calendars selected<p>Next sync: when you open Calendar.</p></div><div class="card stat"><span class="eyebrow">BACKUPS</span><strong>✓</strong>last verified today<p>Your latest local backup is ready to restore.</p></div></div>';
      if(examples[section]){const singular={Projects:"project",Clients:"client",Products:"product",People:"person"}[section];return `<div class="card"><span class="eyebrow">REFERENCE DATA</span><h2>${section}</h2><p>Manage the ${section.toLowerCase()} used to organise your work.</p><button class="button">Add ${singular}</button><div class="form"><label>Search ${section.toLowerCase()}<input placeholder="Find a ${singular}…"></label></div>${examples[section].map(([title,detail])=>`<div class="row"><span><strong>${text(title)}</strong><small>${text(detail)}</small></span><b>→</b></div>`).join("")}</div>`}
      const fields={Identity:[["My email addresses","me@example.com, me@example.org"],["Internal domains","example.com"]],Today:[["Maximum must-dos","3"],["Morning brief time","06:00"],["Meeting-heavy day from","5 hours"]],Calendar:[["Display time zone","Europe/Paris"],["Calendars shown","Work, Personal"],["Default calendar","Work"]],Connections:[["Google Calendar","Connected"],["Google Drive","Not connected"]],Backups:[["Off-Drive backup folder","/Volumes/Backup/LifeOS"],["Latest verified backup","Today · 08:42"]]};
      const titles={Identity:"Identity & people rules",Today:"Today & morning brief",Calendar:"Calendar preferences",Connections:"Connected services",Backups:"Backups & recovery"};
      return `<div class="card form"><span class="eyebrow">${section.toUpperCase()}</span><h2>${titles[section]}</h2><p>Choose the settings that shape this part of your workspace.</p>${fields[section].map(([label,value])=>`<label>${label}<input value="${text(value)}"></label>`).join("")}<button class="button">Save ${section.toLowerCase()} settings</button></div>`;
    }
    function render(){document.body.dataset.variant=variant;document.getElementById("variant-title").textContent=`SETTINGS · PROTOTYPE ${variant}`;document.getElementById("headline").textContent=headlines[variant];document.getElementById("description").textContent=descriptions[variant];document.getElementById("variant-name").innerHTML=`<strong>${variant}</strong> ${names[variant]}`;document.getElementById("state").textContent=`Showing: ${variant} · ${section}`;document.getElementById("tabs").innerHTML=sections.map((name,index)=>`${index===1?'<span class="group">PREFERENCES</span>':''}${index===6?'<span class="group">REFERENCE DATA</span>':''}<button type="button" data-section="${name}" ${section===name?'aria-current="page"':''}>${name}</button>`).join("");document.getElementById("content").innerHTML=panel()}
    function switchVariant(step){variant=variants[(variants.indexOf(variant)+step+variants.length)%variants.length];const url=new URL(location.href);url.searchParams.set("variant",variant);history.replaceState(null,"",url);render()}
    document.getElementById("previous").onclick=()=>switchVariant(-1);document.getElementById("next").onclick=()=>switchVariant(1);document.getElementById("tabs").onclick=(event)=>{const button=event.target.closest("button[data-section]");if(button){section=button.dataset.section;render()}};
    document.addEventListener("keydown",event=>{if((event.key==="ArrowLeft"||event.key==="ArrowRight")&&!event.target.closest("input,textarea,select,[contenteditable]"))switchVariant(event.key==="ArrowRight"?1:-1)});
    render();
  </script>
</body>
</html>
