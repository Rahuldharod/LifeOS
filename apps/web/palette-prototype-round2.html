  <style>

kground:#0a1128;color:#fefcfb;font-size:10px;font-weight:800;letter-spacing:.08em;box-shadow:0 4px 14px #0a112833}.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:30px}.swatch{display:flex;align-items:center;gap:6px;font-size:10px;opacity:.8}.swatch i{width:17px;height:17px;border:1px solid #0a112833;border-radius:5px}.canvas{min-height:100vh;padding-bottom:110px}.shell{display:grid;grid-template-columns:206px minmax(0,1fr);min-height:100vh}.sidebar{padding:30px 17px;display:flex;flex-direction:column;gap:30px}.sidebar nav{display:grid;gap:4px}.sidebar .settings{margin-top:auto}.main{min-width:0;padding:42px clamp(25px,4.8vw,76px)}.page-intro{display:flex;align-items:start;justify-content:space-between;gap:24px;margin-bottom:30px}.page-intro p{max-width:57ch;margin-top:12px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.section-title h2{margin:0}

    /* B — Red focus: strong red hero, short focused work queue and narrow timeline. */
    body[data-variant="B"]{--rule:#7800002b;background:#fff;color:#780000}body[data-variant="B"] .sidebar{background:#fdf0d5;color:#003049}body[data-variant="B"] .nav-item.selected{background:#003049;color:#fdf0d5}body[data-variant="B"] .main{padding-top:25px;background:#fff}body[data-variant="B"] .action{background:#003049;color:#fff}body[data-variant="B"] .pill{background:#fdf0d5;color:#780000}.b-hero{padding:31px 34px;background:#780000;color:#fdf0d5;border-radius:16px}.b-hero h1{max-width:12ch}.b-hero .action{background:#fdf0d5;color:#780000}.b-layout{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:36px;margin-top:33px}.b-focus .task-row:first-of-type{padding:23px;margin-bottom:12px;background:#c1121f0f;border:1px solid #c1121f44;border-radius:11px}.b-focus .task-row:first-of-type .check{margin-left:17px}.b-focus .task-row:first-of-type b{font-size:18px}.b-focus .check{color:#c1121f}.b-rail{border-left:3px solid #669bbc;padding-left:22px}.b-rail .meeting-row{display:block;padding-left:14px;border-left:1px solid #669bbc}.b-rail time{display:block;color:#c1121f;margin-bottom:5px}.b-rail .card{margin-top:20px;padding:18px;background:#fdf0d5}
    /* C — Blue horizon: wide top navigation, horizontal day strip, split briefing. */
    body[data-variant="C"]{--rule:#00304935;background:#fdf0d5;color:#003049}body[data-variant="C"] .topnav{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:20px clamp(25px,5vw,82px);background:#003049;color:#fdf0d5}body[data-variant="C"] .topnav nav{display:flex;gap:2px;flex-wrap:wrap}body[data-variant="C"] .topnav .nav-item{width:auto}body[data-variant="C"] .topnav .selected{background:#669bbc;color:#003049}body[data-variant="C"] .main{padding-top:47px}body[data-variant="C"] .action{background:#c1121f;color:#fff}body[data-variant="C"] .pill{background:#669bbc50;color:#003049}.c-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin:31px 0;background:#00304933;border:1px solid #00304933;border-radius:13px;overflow:hidden}.c-strip div{min-height:108px;padding:19px;background:#fff}.c-strip b{display:block;margin-top:10px;font-size:15px}.c-lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,.7fr);gap:24px}.c-lower .card{background:#fff;border:1px solid #00304925}.c-callout{background:#669bbc33!important}.c-callout strong{display:block;margin:14px 0 8px;font-size:23px;letter-spacing:-.04em}.c-callout .action{margin-top:19px}

    /* E — Blue editorial: almost-white canvas, oversized type, no cards for tasks. */
    body[data-variant="E"]{--rule:#001f542b;background:#fefcfb;color:#001f54}body[data-variant="E"] .tiny-rail{width:74px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px 8px;background:#001f54;color:#fefcfb}body[data-variant="E"] .tiny-rail .brand{font-size:20px}body[data-variant="E"] .tiny-rail button{width:43px;height:43px;border:0;border-radius:10px;background:transparent;color:inherit;font-weight:850}body[data-variant="E"] .tiny-rail button.selected{background:#034078}body[data-variant="E"] .main{margin-left:74px;padding-top:48px}body[data-variant="E"] .action{background:#034078;color:#fefcfb}body[data-variant="E"] .pill{background:#1282a224;color:#034078}.e-header{padding-bottom:30px;border-bottom:3px solid #034078}.e-header h1{max-width:18ch;font-size:clamp(42px,5vw,72px);color:#034078}.e-columns{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(270px,.75fr);gap:65px;margin-top:39px}.e-list .task-row{padding:24px 0}.e-list .task-row:first-of-type{border-top:0}.e-list .task-row b{font-size:18px}.e-list .check{color:#034078}.e-aside{padding:0 0 0 27px;border-left:1px solid #001f543d}.e-aside .meeting-row{padding:21px 0}.e-note{margin-top:28px;padding:21px;border-left:5px solid #1282a2;background:#1282a213}
    /* F — Cyan lanes: top navigation, four horizontal work lanes, bright action accent. */
    body[data-variant="F"]{--rule:#03407833;background:#eef6f8;color:#0a1128}body[data-variant="F"] .topnav{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:18px clamp(25px,4vw,70px);background:#001f54;color:#fefcfb}body[data-variant="F"] .topnav nav{display:flex;flex-wrap:wrap;gap:3px}body[data-variant="F"] .topnav .nav-item{width:auto}body[data-variant="F"] .topnav .selected{background:#034078}body[data-variant="F"] .main{padding-top:35px}body[data-variant="F"] .action{background:#034078;color:#fefcfb}body[data-variant="F"] .pill{background:#1282a22a;color:#001f54}.f-overview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:27px 0 22px}.f-overview div{padding:17px 20px;background:#fefcfb;border-top:4px solid #1282a2;border-radius:8px}.f-overview b{display:block;font-size:27px;margin-top:8px}.f-lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.f-lane{min-height:310px;padding:20px;background:#dceef2;border:1px solid #03407825;border-radius:13px}.f-lane:nth-child(2){background:#fefcfb}.f-lane:nth-child(3){background:#d6e4ef}.f-lane h2{margin-bottom:16px}.f-ticket{padding:17px;margin:10px 0;background:#fefcfb;border:1px solid #03407820;border-radius:9px;font-size:13px}.f-ticket strong,.f-ticket small{display:block}.f-ticket small{margin-top:8px;opacity:.65}.f-ticket .meta{display:block;color:#034078;margin-bottom:8px}.f-lane:nth-child(2) .f-ticket{background:#eef6f8}
    .switcher{position:fixed;z-index:12;bottom:15px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;max-width:calc(100vw - 24px);padding:7px 10px;border-radius:999px;background:#0a1128;color:#fefcfb;box-shadow:0 9px 30px #0a112866;font-size:12px;white-space:nowrap}.switcher button{min-width:34px;height:34px;border:0;border-radius:18px;background:#034078;color:#fefcfb;font-weight:800}.switcher button.current{background:#fefcfb;color:#001f54}.switcher .arrow{min-width:36px;background:#1282a2}.switcher .label{padding:0 7px;max-width:190px;overflow:hidden;text-overflow:ellipsis}.switcher .divider{width:1px;height:24px;background:#fefcfb50}.switcher button:focus-visible{outline-color:#fefcfb}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:1000px){.a-grid,.b-layout,.c-lower,.d-layout,.e-columns{grid-template-columns:1fr}.e-columns{gap:28px}.b-rail{border-left:0;border-top:3px solid #669bbc;padding:20px 0 0}.f-lanes{grid-template-columns:1fr}.f-lane{min-height:0}.c-strip{grid-template-columns:repeat(2,1fr)}}

  </style>
</head>
<body data-variant="A">
  <div class="preview-note">PROTOTYPE · EXAMPLE CONTENT · NO SAVING</div>
  <div id="screen" class="canvas"></div>
  <div class="switcher" aria-label="Design variation switcher">
    <button class="arrow" id="previous" aria-label="Previous variation">←</button>
    <span class="label" id="variant-label"></span><span class="divider"></span>
    <button data-choice="A">A</button><button data-choice="B">B</button><button data-choice="C">C</button>
    <span class="divider"></span>
    <button data-choice="D">D</button><button data-choice="E">E</button><button data-choice="F">F</button>
    <button class="arrow" id="next" aria-label="Next variation">→</button>
  </div>
  <div id="state" class="sr-only" role="status" aria-live="polite"></div>
  <script>
    const variants=["A","B","C","D","E","F"];
    const names={A:"Warm ledger",B:"Red focus",C:"Blue horizon",D:"Midnight command",E:"Blue editorial",F:"Cyan lanes"};
    const palette={warm:[["#780000","Burgundy"],["#C1121F","Red"],["#FDF0D5","Cream"],["#003049","Navy"],["#669BBC","Sky"]],cool:[["#0A1128","Midnight"],["#001F54","Navy"],["#034078","Blue"],["#1282A2","Cyan"],["#FEFCFB","White"]]};
    const tasks=[{title:"Prepare meeting notes",detail:"Project check-in · Today",kind:"Must-do"},{title:"Review household budget",detail:"Household · Tomorrow",kind:"Task"},{title:"Plan weekend hike",detail:"Personal · This week",kind:"Task"}];
    const meetings=[{time:"10:30",title:"Project check-in",detail:"Notes ready · 30 min"},{time:"14:00",title:"Call with Alex",detail:"1 open point · 45 min"}];
    const swatches=kind=>`<div class="swatches" aria-label="${kind} palette">${palette[kind].map(([hex,name])=>`<span class="swatch"><i style="background:${hex}"></i>${name} · ${hex}</span>`).join("")}</div>`;
    const sideNav=()=>`<aside class="sidebar"><div class="brand">LifeOS</div><nav aria-label="Main navigation"><button class="nav-item selected">Today</button><button class="nav-item">Calendar</button><button class="nav-item">Tasks</button><button class="nav-item">Notes</button><button class="nav-item">Inbox</button><button class="nav-item">Explore</button></nav><button class="nav-item settings">Settings</button></aside>`;
    const topNav=()=>`<header class="topnav"><div class="brand">LifeOS</div><nav aria-label="Main navigation"><button class="nav-item selected">Today</button><button class="nav-item">Calendar</button><button class="nav-item">Tasks</button><button class="nav-item">Notes</button><button class="nav-item">Inbox</button><button class="nav-item">Settings</button></nav></header>`;
    const taskRows=()=>tasks.map(t=>`<div class="task-row"><button class="check" aria-label="Preview complete ${t.title}"></button><span><b>${t.title}</b><small>${t.detail}</small></span></div>`).join("");
    const meetingRows=()=>meetings.map(m=>`<div class="meeting-row"><time>${m.time}</time><span><b>${m.title}</b><small>${m.detail}</small></span></div>`).join("");
    const A=()=>`<div class="shell">${sideNav()}<main class="main"><div class="page-intro"><div><div class="meta eyebrow">Today · warm palette / A</div><h1>Make room for what matters.</h1><p class="muted">A calm daily ledger: your priorities first, with meetings and review nearby.</p></div><button class="action">+ Capture</button></div><div class="a-grid"><section class="a-ledger"><div class="section-title"><h2>Your three priorities</h2><span class="pill">1 of 3 complete</span></div>${taskRows()}<button class="link">View all tasks →</button></section><div class="a-side"><section class="card"><div class="section-title"><h2>Next meetings</h2><button class="link">Calendar →</button></div>${meetingRows()}</section><section class="card a-inbox"><div class="meta">Needs your review</div><strong>3 items</strong><p class="small">Proposed actions wait until you choose what to keep.</p><button class="action" style="margin-top:16px">Open Inbox</button></section></div></div>${swatches("warm")}</main></div>`;
    const B=()=>`<div class="shell">${sideNav()}<main class="main"><div class="b-hero"><div class="row"><div><div class="meta eyebrow">Today · warm palette / B</div><h1>Do the important thing first.</h1><p>One clear priority, then the rest of your day.</p></div><button class="action">+ Capture</button></div></div><div class="b-layout"><section class="b-focus"><div class="section-title"><h2>Focus queue</h2><span class="pill">3 to do</span></div>${taskRows()}<button class="link">All tasks →</button></section><aside class="b-rail"><div class="meta eyebrow">Your timeline</div>${meetingRows()}<div class="card"><div class="meta">Inbox</div><h2 style="margin:10px 0">3 to review</h2><p class="small">Two task proposals and one summary.</p></div></aside></div>${swatches("warm")}</main></div>`;
    const C=()=>`${topNav()}<main class="main"><div class="page-intro"><div><div class="meta eyebrow">Today · warm palette / C</div><h1>A day with breathing room.</h1><p class="muted">A wide-view schedule, then a short list of useful next steps.</p></div><button class="action">+ Quick capture</button></div><div class="c-strip"><div><span class="meta">Now</span><b>Prepare notes</b><span class="small muted">Your first priority</span></div><div><span class="meta">10:30</span><b>Project check-in</b><span class="small muted">30 min</span></div><div><span class="meta">14:00</span><b>Call with Alex</b><span class="small muted">45 min</span></div><div><span class="meta">Later</span><b>Review Inbox</b><span class="small muted">3 items</span></div></div><div class="c-lower"><section class="card"><div class="section-title"><h2>Your focus</h2><button class="link">Tasks →</button></div>${taskRows()}</section><aside class="card c-callout"><div class="meta">From your brief</div><strong>Start with the project check-in.</strong><p class="small">Preparing the notes now will make the meeting easier.</p><button class="action">Open notes</button></aside></div>${swatches("warm")}</main>`;
    const D=()=>`<div class="shell">${sideNav()}<main class="main"><div class="d-banner"><div class="row"><div><div class="meta eyebrow">Today · cool palette / D</div><h1>Ready for today.</h1><p>Clear priorities. The next meeting. Nothing competing for attention.</p></div><button class="action">+ Capture</button></div></div><div class="d-layout"><section class="card d-focus"><div class="section-title"><h2>Priority stack</h2><span class="pill">Top 3</span></div>${taskRows()}</section><aside class="card d-rail"><div class="meta eyebrow">Agenda</div>${meetingRows()}<div class="card"><div class="meta">Needs review</div><h2 style="margin:9px 0">3 Inbox items</h2><p class="small">Decide what to keep.</p></div></aside></div>${swatches("cool")}</main></div>`;
    const E=()=>`<aside class="tiny-rail" aria-label="Main navigation"><div class="brand">L.</div><button class="selected" aria-label="Today">◉</button><button aria-label="Calendar">▦</button><button aria-label="Tasks">☑</button><button aria-label="Notes">▤</button><button aria-label="Inbox">◇</button></aside><main class="main"><header class="e-header"><div class="meta eyebrow">Today · cool palette / E</div><div class="row"><h1>Begin with the next useful step.</h1><button class="action">+ Capture</button></div><p class="muted" style="margin-top:14px">Saturday, 10 October · Your day at a glance</p></header><div class="e-columns"><section class="e-list"><div class="section-title"><h2>What matters</h2><span class="pill">3 priorities</span></div>${taskRows()}<button class="link">View all tasks →</button></section><aside class="e-aside"><div class="section-title"><h2>Coming up</h2><button class="link">Calendar →</button></div>${meetingRows()}<div class="e-note"><div class="meta">Inbox</div><h2 style="margin:10px 0">3 things need a decision.</h2><p class="small">They can wait until after your first meeting.</p></div></aside></div>${swatches("cool")}</main>`;
    const F=()=>`${topNav()}<main class="main"><div class="page-intro"><div><div class="meta eyebrow">Today · cool palette / F</div><h1>Your day, in lanes.</h1><p class="muted">Use the sections to scan work, schedule, and follow-ups at once.</p></div><button class="action">+ Capture</button></div><div class="f-overview"><div><span class="meta">Priority work</span><b>3</b><span class="small">Two due soon</span></div><div><span class="meta">Meetings</span><b>2</b><span class="small">Next at 10:30</span></div><div><span class="meta">Inbox</span><b>3</b><span class="small">Waiting for review</span></div></div><div class="f-lanes"><section class="f-lane"><h2>Do next</h2>${tasks.map(t=>`<div class="f-ticket"><span class="meta">${t.kind}</span><strong>${t.title}</strong><small>${t.detail}</small></div>`).join("")}</section><section class="f-lane"><h2>On your calendar</h2>${meetings.map(m=>`<div class="f-ticket"><span class="meta">${m.time}</span><strong>${m.title}</strong><small>${m.detail}</small></div>`).join("")}</section><section class="f-lane"><h2>Needs a decision</h2><div class="f-ticket"><span class="meta">Inbox</span><strong>Meeting follow-up draft</strong><small>Review before adding tasks</small></div><div class="f-ticket"><span class="meta">Inbox</span><strong>Two captured ideas</strong><small>Keep, edit, or dismiss</small></div></section></div>${swatches("cool")}</main>`;
    let variant=new URL(location.href).searchParams.get("variant")||"A";if(!variants.includes(variant))variant="A";
    function render(){document.body.dataset.variant=variant;document.getElementById("screen").innerHTML=({A,B,C,D,E,F})[variant]();document.getElementById("variant-label").textContent=`${variant} · ${names[variant]}`;document.getElementById("state").textContent=`Showing ${variant}, ${names[variant]}, ${variants.indexOf(variant)<3?"warm":"cool"} palette`;document.querySelectorAll("[data-choice]").forEach(button=>{const active=button.dataset.choice===variant;button.classList.toggle("current",active);button.setAttribute("aria-current",active?"true":"false")})}
    function choose(next){variant=next;const url=new URL(location.href);url.searchParams.set("variant",variant);history.replaceState(null,"",url);render()}
    function cycle(step){choose(variants[(variants.indexOf(variant)+step+variants.length)%variants.length])}
    document.getElementById("previous").addEventListener("click",()=>cycle(-1));document.getElementById("next").addEventListener("click",()=>cycle(1));document.querySelectorAll("[data-choice]").forEach(button=>button.addEventListener("click",()=>choose(button.dataset.choice)));document.addEventListener("keydown",event=>{if((event.key==="ArrowLeft"||event.key==="ArrowRight")&&!event.target.closest("input,textarea,select,[contenteditable]")){event.preventDefault();cycle(event.key==="ArrowRight"?1:-1)}});render();
  </script>
</body>
</html>
