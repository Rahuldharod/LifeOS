<!doctype html>
<!-- PROTOTYPE ONLY — LifeOS Today concepts using the five colours supplied by the user. Synthetic content; no data connection. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LifeOS palette directions</title>
  <style>
    :root{--cream:#efead8;--teal:#2e7d7a;--deep-teal:#00555a;--forest:#2c4e37;--ink:#1e1e1e;--white:#fff;--line:#d9d8cb;--muted:#5c625d}
    *{box-sizing:border-box}html{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{margin:0;color:var(--ink);background:var(--cream)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--deep-teal);outline-offset:3px}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(32px,3vw,46px);line-height:1.08;letter-spacing:-.045em}h2{font-size:21px;letter-spacing:-.025em}h3{font-size:16px}p{line-height:1.5}.eyebrow{color:var(--deep-teal);font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.muted{color:var(--muted)}.capsule{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;background:#00555a16;color:var(--deep-teal);font-size:11px;font-weight:750}
    .app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:33px 20px;color:var(--cream);display:flex;flex-direction:column}.brand{font-size:28px;font-weight:750;letter-spacing:-.06em}.sidebar nav{display:grid;gap:4px;margin-top:41px}.sidebar nav button,.sidebar footer button{min-height:42px;padding:10px 12px;border:0;border-radius:8px;background:transparent;color:inherit;text-align:left}.sidebar nav button.active{background:#ffffff25;font-weight:750}.sidebar footer{margin-top:auto;border-top:1px solid #ffffff45;padding-top:15px}.sidebar footer button{width:100%}.main{min-width:0;padding:38px clamp(26px,4vw,72px) 120px}.prototype-flag{position:fixed;z-index:8;right:16px;top:13px;padding:7px 10px;border-radius:99px;background:var(--ink);color:#fff;font-size:11px;font-weight:750;letter-spacing:.06em}.topline{display:flex;align-items:start;justify-content:space-between;gap:20px;margin-bottom:28px}.topline p{max-width:53ch;margin:11px 0 0;color:var(--muted)}.primary{min-height:44px;padding:10px 17px;border:1px solid var(--deep-teal);border-radius:9px;background:var(--deep-teal);color:#fff;font-weight:750}.secondary{min-height:44px;padding:10px 17px;border:1px solid var(--deep-teal);border-radius:9px;background:transparent;color:var(--deep-teal);font-weight:750}.surface{background:#fff;border:1px solid var(--line);border-radius:14px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.section-head h2{margin:0}.section-head a{color:var(--deep-teal);font-size:13px;font-weight:750;text-decoration:none}.section-head a:hover{text-decoration:underline}.task{display:flex;align-items:start;gap:12px;padding:15px 0;border-top:1px solid var(--line)}.task:first-of-type{border-top:0}.check{flex:none;width:23px;height:23px;border:2px solid var(--deep-teal);border-radius:6px;background:transparent}.task strong,.task small{display:block}.task small{margin-top:4px;color:var(--muted);font-size:12px}.task .tag{margin-left:auto;padding:4px 8px;border-radius:99px;background:#2e7d7a1a;color:var(--deep-teal);font-size:11px;font-weight:700;white-space:nowrap}.meeting{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;padding:14px 0;border-top:1px solid var(--line)}.meeting:first-of-type{border-top:0}.meeting time{color:var(--deep-teal);font-weight:800}.meeting strong,.meeting small{display:block}.meeting small{color:var(--muted);margin-top:4px}.swatches{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.swatches span{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--muted)}.swatches i{display:inline-block;width:17px;height:17px;border:1px solid #0002;border-radius:5px}
    /* A: light cream canvas, green navigation, clear priority list. */
    body[data-variant="A"] .sidebar{background:var(--forest)}body[data-variant="A"] .main{background:var(--cream)}.a-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(310px,.8fr);gap:18px}.a-focus{grid-row:span 2;padding:27px 30px}.a-focus .focus-intro{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:27px}.a-focus .focus-intro strong{font-size:15px}.a-focus .task{padding:19px 0}.a-meetings,.a-inbox{padding:24px}.a-inbox{background:#f9f7ef}.a-inbox strong{display:block;font-size:27px;color:var(--forest)}.a-inbox p{margin:4px 0 16px;font-size:13px;color:var(--muted)}.a-capture{display:flex;align-items:center;gap:10px;margin-top:18px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:12px}.a-capture input{flex:1;min-width:0;border:0;outline:0;padding:8px 10px}.a-swatches{margin-top:22px}
    /* B: forest command banner, compact cards, teal right rail. */
    body[data-variant="B"] .sidebar{background:var(--ink)}body[data-variant="B"] .main{background:#f8f6ee}.b-banner{padding:29px 32px;margin-bottom:19px;border-radius:15px;background:var(--forest);color:#fff}.b-banner .eyebrow{color:#d6ebe4}.b-banner h1{margin:8px 0 8px;color:#fff}.b-banner p{color:#e5eee8}.b-banner .primary{background:var(--cream);border-color:var(--cream);color:var(--forest)}.b-banner .capsule{background:#ffffff22;color:#fff}.b-banner-row{display:flex;justify-content:space-between;gap:20px}.b-layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:18px}.b-work{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.b-work .surface{padding:22px}.b-work .wide{grid-column:1/-1}.b-work .task{padding:14px 0}.b-rail{padding:23px;background:var(--deep-teal);color:#fff;border-radius:14px}.b-rail .eyebrow,.b-rail .muted{color:#d6eeec}.b-rail h2{color:#fff}.b-rail .meeting{border-color:#ffffff44}.b-rail .meeting time,.b-rail .meeting small{color:#e7f5f3}.b-rail .secondary{width:100%;margin-top:18px;border-color:#fff;color:#fff}.b-swatches{margin-top:18px}
    /* C: teal navigation, editorial focus line, schedule beside work. */
    body[data-variant="C"] .sidebar{background:var(--deep-teal)}body[data-variant="C"] .main{background:#fff}.c-top{padding-bottom:22px;border-bottom:2px solid var(--forest)}.c-top h1{margin:8px 0 7px}.c-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(310px,.8fr);gap:42px;margin-top:31px}.c-focus .section-head{margin-bottom:12px}.c-focus .task{padding:21px 0}.c-focus .task:first-of-type{border-top:2px solid var(--ink)}.c-next{margin-top:36px;padding:22px 25px;border-left:5px solid var(--teal);background:#efead899}.c-next .eyebrow{margin-bottom:10px}.c-next strong{display:block;margin-bottom:7px;font-size:20px}.c-schedule{padding:25px;background:var(--cream);border-radius:12px}.c-schedule .meeting{border-color:#c9c9b9}.c-count{display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding:17px 0;border-top:1px solid #bfc3b5}.c-count strong{font-size:29px;color:var(--forest)}.c-swatches{margin-top:25px}
    .switcher{position:fixed;z-index:9;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;max-width:calc(100vw - 32px);padding:6px;border-radius:999px;background:#1e1e1e;color:#fff;box-shadow:0 9px 30px #0005;font-size:12px;white-space:nowrap}.switcher button{display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:50%;background:#424242;color:#fff;font-size:18px}.switcher span{padding:0 6px}.switcher strong{color:#9de0dc}.state{position:fixed;right:16px;bottom:20px;z-index:8;padding:7px 10px;border-radius:7px;background:#1e1e1e;color:#fff;font-size:11px}
    @media(max-width:1050px){.a-grid,.b-layout,.c-layout{grid-template-columns:1fr}.a-focus{grid-row:auto}.b-rail{order:-1}.state{display:none}}@media(max-width:720px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;padding:15px 20px}.brand{font-size:23px}.sidebar nav{display:flex;flex-wrap:wrap;gap:0;margin-top:10px}.sidebar footer{display:none}.main{padding:29px 20px 95px}.topline{display:block}.topline .primary{margin-top:20px}.b-work{grid-template-columns:1fr}.b-work .wide{grid-column:auto}.b-banner-row{display:block}.b-banner .primary{margin-top:18px}.switcher span{max-width:200px;overflow:hidden;text-overflow:ellipsis}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body data-variant="A">
  <div class="prototype-flag">PROTOTYPE · Example content · No saving</div>
  <div class="app"><aside class="sidebar"><div class="brand">LifeOS</div><nav aria-label="LifeOS navigation"><button class="active">Today</button><button>Calendar</button><button>Tasks</button><button>Notes</button><button>Inbox</button><button>Explore</button></nav><footer><button>Settings</button></footer></aside><main class="main" id="screen"></main></div>
  <div class="state" id="state" role="status"></div><div class="switcher" aria-label="Palette prototypes"><button id="previous" aria-label="Previous design">←</button><span id="variant-label"></span><button id="next" aria-label="Next design">→</button></div>
  <script>
    const variants=["A","B","C"],names={A:"Cream-led · calm",B:"Forest-led · focused",C:"Teal-led · editorial"};
    let variant=new URL(location.href).searchParams.get("variant")||"A";if(!variants.includes(variant))variant="A";
    const swatches='<div class="swatches" aria-label="Palette"><span><i style="background:#efead8"></i>#EFEAD8</span><span><i style="background:#2e7d7a"></i>#2E7D7A</span><span><i style="background:#00555a"></i>#00555A</span><span><i style="background:#2c4e37"></i>#2C4E37</span><span><i style="background:#1e1e1e"></i>#1E1E1E</span></div>';
    const tasks='<div class="task"><button class="check" aria-label="Complete Prepare meeting notes"></button><span><strong>Prepare meeting notes</strong><small>Project check-in · Due today</small></span><span class="tag">Must-do</span></div><div class="task"><button class="check" aria-label="Complete Review household budget"></button><span><strong>Review household budget</strong><small>Household · Due tomorrow</small></span></div><div class="task"><button class="check" aria-label="Complete Plan weekend hike"></button><span><strong>Plan weekend hike</strong><small>Personal · This week</small></span></div>';
    const meetings='<div class="meeting"><time>10:30</time><span><strong>Project check-in</strong><small>Notes ready · 30 min</small></span></div><div class="meeting"><time>14:00</time><span><strong>Call with Alex</strong><small>1 open point · 45 min</small></span></div>';
    const a=()=>`<div class="topline"><div><span class="eyebrow">Today · Palette direction A</span><h1>Make room for what matters.</h1><p>Three priorities, the meetings ahead, and a quiet place to capture what comes up.</p></div><button class="primary">+ Capture</button></div><div class="a-grid"><section class="surface a-focus"><div class="focus-intro"><div><span class="eyebrow">Your focus</span><h2>Top 3 for today</h2></div><span class="capsule">1 of 3 complete</span></div>${tasks}<button class="secondary" style="margin-top:24px">View all tasks</button></section><section class="surface a-meetings"><div class="section-head"><h2>Next meetings</h2><a href="#" onclick="return false">Calendar →</a></div>${meetings}</section><section class="surface a-inbox"><span class="eyebrow">Needs your review</span><strong>3 items in Inbox</strong><p>Proposed actions stay here until you decide.</p><button class="secondary">Open Inbox</button></section></div><div class="a-capture"><input aria-label="Quick capture" placeholder="Capture a thought, task or link…"><button class="primary">Capture</button></div><div class="a-swatches">${swatches}</div>`;
    const b=()=>`<div class="b-banner"><div class="b-banner-row"><div><span class="eyebrow">Today · Palette direction B</span><h1>Good morning.</h1><p>One place to see the work that deserves your attention.</p></div><div><span class="capsule">3 must-dos · 2 meetings</span><br><button class="primary">+ Quick capture</button></div></div></div><div class="b-layout"><div class="b-work"><section class="surface wide"><div class="section-head"><h2>Focus now</h2><a href="#" onclick="return false">See all tasks →</a></div>${tasks}</section><section class="surface"><span class="eyebrow">Inbox</span><h2>3 things to review</h2><p class="muted">Two task proposals and one meeting summary.</p><button class="secondary">Review items</button></section><section class="surface"><span class="eyebrow">Waiting on</span><h2>2 open commitments</h2><p class="muted">Follow up when the timing is right.</p><button class="secondary">View waiting</button></section></div><aside class="b-rail"><span class="eyebrow">Your day</span><h2>Coming up</h2>${meetings}<button class="secondary">Open calendar</button></aside></div><div class="b-swatches">${swatches}</div>`;
    const c=()=>`<header class="c-top"><span class="eyebrow">Today · Palette direction C</span><h1>A clear day starts here.</h1><p class="muted">Focus on the next useful step. Everything else can wait.</p></header><div class="c-layout"><div class="c-focus"><div class="section-head"><h2>What matters today</h2><span class="capsule">Top 3</span></div>${tasks}<div class="c-next"><span class="eyebrow">From your morning brief</span><strong>Start with the project check-in.</strong><p>Preparing the notes now will make the decision easier in the meeting.</p><button class="primary">Open meeting notes</button></div></div><aside class="c-schedule"><div class="section-head"><h2>Your schedule</h2><a href="#" onclick="return false">Full day →</a></div>${meetings}<div class="c-count"><span><strong>3</strong><br>Inbox items</span><button class="secondary">Review →</button></div></aside></div><div class="c-swatches">${swatches}</div>`;
    function render(){document.body.dataset.variant=variant;document.getElementById("screen").innerHTML=({A:a,B:b,C:c})[variant]();document.getElementById("variant-label").innerHTML=`<strong>${variant}</strong> ${names[variant]}`;document.getElementById("state").textContent=`Showing ${variant}: ${names[variant]}`}
    function switchVariant(step){variant=variants[(variants.indexOf(variant)+step+variants.length)%variants.length];const url=new URL(location.href);url.searchParams.set("variant",variant);history.replaceState(null,"",url);render()}
    document.getElementById("previous").onclick=()=>switchVariant(-1);document.getElementById("next").onclick=()=>switchVariant(1);document.addEventListener("keydown",event=>{if((event.key==="ArrowLeft"||event.key==="ArrowRight")&&!event.target.closest("input,textarea,select,[contenteditable]")){event.preventDefault();switchVariant(event.key==="ArrowRight"?1:-1)}});render();
  </script>
</body>
</html>
